<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Certificate OCR System Dashboard Preview">
  <defs>
    <linearGradient id="ocr_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081b24"/>
      <stop offset="50%" stop-color="#0c2d38"/>
      <stop offset="100%" stop-color="#06161e"/>
    </linearGradient>
    <linearGradient id="ocr_accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="ocr_panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.06)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>
    <pattern id="ocr_grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(94, 234, 212, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#ocr_bg)"/>
  <rect width="800" height="450" fill="url(#ocr_grid)"/>

  <!-- Top App Header -->
  <rect x="0" y="0" width="800" height="48" fill="rgba(6, 24, 31, 0.85)" stroke="rgba(94, 234, 212, 0.12)" stroke-width="1"/>
  
  <!-- Header Title -->
  <g transform="translate(24, 15)">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="url(#ocr_accent)"/>
    <text x="28" y="14" fill="#f0faf8" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="0.5">CERTIFICATE OCR SYSTEM</text>
    <text x="210" y="14" fill="#5eead4" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600">· OPENCV &amp; TESSERACT PIPELINE</text>
  </g>

  <g transform="translate(680, 16)">
    <circle cx="8" cy="8" r="4" fill="#5eead4"/>
    <text x="20" y="11" fill="#b8d0d0" font-family="'Inter', system-ui, sans-serif" font-size="11">OCR Ready</text>
  </g>

  <!-- Left: Document Preview & Preprocessing -->
  <rect x="24" y="68" width="360" height="358" rx="14" fill="url(#ocr_panel)" stroke="rgba(94, 234, 212, 0.16)" stroke-width="1"/>
  <text x="44" y="98" fill="#5eead4" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">DOCUMENT PREPROCESSING</text>

  <!-- Certificate Graphic Container -->
  <rect x="44" y="116" width="320" height="230" rx="8" fill="rgba(6, 24, 31, 0.7)" stroke="rgba(94, 234, 212, 0.2)" stroke-width="1"/>
  <rect x="64" y="136" width="280" height="190" rx="4" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(103, 232, 249, 0.3)" stroke-dasharray="4,4"/>
  
  <!-- Certificate Embellishments -->
  <circle cx="204" cy="180" r="22" fill="rgba(94, 234, 212, 0.15)" stroke="#5eead4" stroke-width="1.5"/>
  <text x="204" y="184" text-anchor="middle" fill="#5eead4" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="11">VERIFIED</text>
  <text x="204" y="222" text-anchor="middle" fill="#f0faf8" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="15">ACADEMIC EXCELLENCE</text>
  <text x="204" y="242" text-anchor="middle" fill="#b8d0d0" font-family="'Inter', system-ui, sans-serif" font-size="11">Presented to: Candidate Name</text>
  
  <!-- Bounding Boxes indicating OCR detection -->
  <rect x="94" y="210" width="220" height="20" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="2,2"/>
  <rect x="114" y="232" width="180" height="15" fill="none" stroke="#67e8f9" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- Pipeline Controls -->
  <rect x="44" y="360" width="150" height="44" rx="8" fill="rgba(94, 234, 212, 0.12)" stroke="rgba(94, 234, 212, 0.3)" stroke-width="1"/>
  <text x="60" y="386" fill="#5eead4" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="11">Binarization: OTSU</text>
  
  <rect x="214" y="360" width="150" height="44" rx="8" fill="rgba(103, 232, 249, 0.12)" stroke="rgba(103, 232, 249, 0.3)" stroke-width="1"/>
  <text x="230" y="386" fill="#67e8f9" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="11">Deskew: +1.4° Corr</text>

  <!-- Right: Structured Field Extraction & Confidence -->
  <rect x="408" y="68" width="368" height="358" rx="14" fill="url(#ocr_panel)" stroke="rgba(94, 234, 212, 0.16)" stroke-width="1"/>
  <text x="428" y="98" fill="#67e8f9" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">STRUCTURED EXTRACTION &amp; CONFIDENCE</text>

  <!-- Extracted Field 1 -->
  <rect x="428" y="116" width="328" height="60" rx="8" fill="rgba(6, 24, 31, 0.6)" stroke="rgba(94, 234, 212, 0.12)" stroke-width="1"/>
  <text x="444" y="136" fill="#84a5a5" font-family="'Inter', system-ui, sans-serif" font-size="10">RECIPIENT NAME</text>
  <text x="444" y="158" fill="#f0faf8" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="600" font-size="14">Muhammad Rayyan Bhatti</text>
  <text x="680" y="154" fill="#5eead4" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="12">99.4%</text>

  <!-- Extracted Field 2 -->
  <rect x="428" y="186" width="328" height="60" rx="8" fill="rgba(6, 24, 31, 0.6)" stroke="rgba(94, 234, 212, 0.12)" stroke-width="1"/>
  <text x="444" y="206" fill="#84a5a5" font-family="'Inter', system-ui, sans-serif" font-size="10">ISSUING INSTITUTION</text>
  <text x="444" y="228" fill="#f0faf8" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="600" font-size="14">Quaid-i-Azam University</text>
  <text x="680" y="224" fill="#5eead4" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="12">98.7%</text>

  <!-- Extracted Field 3 -->
  <rect x="428" y="256" width="328" height="60" rx="8" fill="rgba(6, 24, 31, 0.6)" stroke="rgba(94, 234, 212, 0.12)" stroke-width="1"/>
  <text x="444" y="276" fill="#84a5a5" font-family="'Inter', system-ui, sans-serif" font-size="10">CREDENTIAL / DEGREE</text>
  <text x="444" y="298" fill="#f0faf8" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="600" font-size="14">Bachelor of Science in CS</text>
  <text x="680" y="294" fill="#5eead4" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="12">99.1%</text>

  <!-- Export Actions -->
  <rect x="428" y="340" width="100" height="38" rx="6" fill="rgba(94, 234, 212, 0.15)" stroke="#5eead4" stroke-width="1"/>
  <text x="456" y="364" fill="#5eead4" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="12">JSON</text>

  <rect x="542" y="340" width="100" height="38" rx="6" fill="rgba(103, 232, 249, 0.15)" stroke="#67e8f9" stroke-width="1"/>
  <text x="566" y="364" fill="#67e8f9" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="12">EXCEL</text>

  <rect x="656" y="340" width="100" height="38" rx="6" fill="rgba(129, 140, 248, 0.15)" stroke="#818cf8" stroke-width="1"/>
  <text x="674" y="364" fill="#818cf8" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="12">SQLITE</text>
</svg>
