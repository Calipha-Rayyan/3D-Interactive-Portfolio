<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="FORESIGHT Nexus Dashboard Preview">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b24"/>
      <stop offset="50%" stop-color="#0b2b36"/>
      <stop offset="100%" stop-color="#05141c"/>
    </linearGradient>
    <linearGradient id="accent_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#28B8FF"/>
      <stop offset="100%" stop-color="#8A63FF"/>
    </linearGradient>
    <linearGradient id="chart_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(40, 184, 255, 0.4)"/>
      <stop offset="100%" stop-color="rgba(40, 184, 255, 0.0)"/>
    </linearGradient>
    <linearGradient id="card_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.06)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>
    <pattern id="grid_pattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(94, 234, 212, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg_grad)"/>
  <rect width="800" height="450" fill="url(#grid_pattern)"/>

  <!-- Top App Header -->
  <rect x="0" y="0" width="800" height="48" fill="rgba(6, 24, 31, 0.85)" stroke="rgba(94, 234, 212, 0.12)" stroke-width="1"/>
  
  <!-- Logo Mark -->
  <g transform="translate(24, 14)">
    <polygon points="10,0 20,18 0,18" fill="url(#accent_grad)"/>
    <text x="28" y="15" fill="#f0faf8" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="1">FORESIGHT NEXUS</text>
    <text x="175" y="15" fill="#5eead4" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">· DEMAND STUDIO</text>
  </g>

  <!-- Status indicators -->
  <circle cx="750" cy="24" r="4" fill="#5eead4"/>
  <text x="700" y="27" fill="#b8d0d0" font-family="'Inter', system-ui, sans-serif" font-size="10">System Online</text>

  <!-- Main Grid Layout -->
  <!-- Left Telemetry Panel -->
  <rect x="24" y="68" width="220" height="358" rx="14" fill="url(#card_grad)" stroke="rgba(94, 234, 212, 0.16)" stroke-width="1"/>
  <text x="44" y="98" fill="#5eead4" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2">INVENTORY INTELLIGENCE</text>
  
  <!-- Metric Card 1 -->
  <rect x="40" y="114" width="188" height="64" rx="8" fill="rgba(6, 24, 31, 0.6)" stroke="rgba(94, 234, 212, 0.1)" stroke-width="1"/>
  <text x="52" y="134" fill="#84a5a5" font-family="'Inter', system-ui, sans-serif" font-size="10">Forecast Accuracy</text>
  <text x="52" y="160" fill="#f0faf8" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="700">94.8%</text>
  <text x="140" y="160" fill="#5eead4" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600">+3.2%</text>

  <!-- Metric Card 2 -->
  <rect x="40" y="190" width="188" height="64" rx="8" fill="rgba(6, 24, 31, 0.6)" stroke="rgba(94, 234, 212, 0.1)" stroke-width="1"/>
  <text x="52" y="210" fill="#84a5a5" font-family="'Inter', system-ui, sans-serif" font-size="10">Stockout Risk Level</text>
  <text x="52" y="236" fill="#67e8f9" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="700">LOW (2.1%)</text>

  <!-- Metric Card 3 -->
  <rect x="40" y="266" width="188" height="64" rx="8" fill="rgba(6, 24, 31, 0.6)" stroke="rgba(94, 234, 212, 0.1)" stroke-width="1"/>
  <text x="52" y="286" fill="#84a5a5" font-family="'Inter', system-ui, sans-serif" font-size="10">Reorder Recommendation</text>
  <text x="52" y="312" fill="#a78bfa" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="700">1,420 Units</text>

  <rect x="40" y="342" width="188" height="64" rx="8" fill="rgba(40, 184, 255, 0.1)" stroke="rgba(40, 184, 255, 0.3)" stroke-width="1"/>
  <text x="52" y="366" fill="#67e8f9" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600">Active Engine: ARIMA + RF</text>
  <text x="52" y="386" fill="#b8d0d0" font-family="'Inter', system-ui, sans-serif" font-size="9">Dual-model ensemble running</text>

  <!-- Main Chart Canvas -->
  <rect x="264" y="68" width="512" height="358" rx="14" fill="url(#card_grad)" stroke="rgba(94, 234, 212, 0.16)" stroke-width="1"/>
  
  <text x="288" y="98" fill="#f0faf8" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="600">Demand Forecast vs Actual Sales</text>
  <text x="288" y="116" fill="#84a5a5" font-family="'Inter', system-ui, sans-serif" font-size="10">Rolling 30-day horizon with 95% confidence interval</text>

  <!-- Chart Axis & Lines -->
  <g transform="translate(288, 140)">
    <!-- Horizontal Gridlines -->
    <line x1="0" y1="0" x2="464" y2="0" stroke="rgba(94, 234, 212, 0.08)" stroke-width="1"/>
    <line x1="0" y1="50" x2="464" y2="50" stroke="rgba(94, 234, 212, 0.08)" stroke-width="1"/>
    <line x1="0" y1="100" x2="464" y2="100" stroke="rgba(94, 234, 212, 0.08)" stroke-width="1"/>
    <line x1="0" y1="150" x2="464" y2="150" stroke="rgba(94, 234, 212, 0.08)" stroke-width="1"/>
    <line x1="0" y1="200" x2="464" y2="200" stroke="rgba(94, 234, 212, 0.16)" stroke-width="1.5"/>

    <!-- Confidence Interval Band -->
    <path d="M 0,140 Q 80,100 150,120 T 300,70 T 464,50 L 464,110 T 300,130 T 150,170 T 0,180 Z" fill="url(#chart_grad)"/>

    <!-- Actual Historical Sales (Solid Mint Line) -->
    <path d="M 0,160 Q 60,140 120,135 T 240,110 T 320,85" fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Forecasted Trajectory (Dashed Violet/Cyan Line) -->
    <path d="M 320,85 Q 380,65 420,72 T 464,60" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-dasharray="6,4" stroke-linecap="round"/>

    <!-- Data Points -->
    <circle cx="120" cy="135" r="4" fill="#5eead4" stroke="#06181f" stroke-width="2"/>
    <circle cx="240" cy="110" r="4" fill="#5eead4" stroke="#06181f" stroke-width="2"/>
    <circle cx="320" cy="85" r="5" fill="#67e8f9" stroke="#06181f" stroke-width="2"/>
    <circle cx="420" cy="72" r="4" fill="#a78bfa" stroke="#06181f" stroke-width="2"/>
    <circle cx="464" cy="60" r="4" fill="#a78bfa" stroke="#06181f" stroke-width="2"/>

    <!-- Callout badge on forecast peak -->
    <g transform="translate(390, 20)">
      <rect x="0" y="0" width="70" height="24" rx="6" fill="#0b3036" stroke="#67e8f9" stroke-width="1"/>
      <text x="35" y="16" fill="#67e8f9" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">+18.4% Peak</text>
    </g>

    <!-- Legend -->
    <g transform="translate(10, 230)">
      <line x1="0" y1="5" x2="20" y2="5" stroke="#5eead4" stroke-width="2"/>
      <text x="28" y="9" fill="#b8d0d0" font-family="'Inter', system-ui, sans-serif" font-size="11">Actual Sales</text>

      <line x1="120" y1="5" x2="140" y2="5" stroke="#67e8f9" stroke-width="2" stroke-dasharray="4,3"/>
      <text x="148" y="9" fill="#b8d0d0" font-family="'Inter', system-ui, sans-serif" font-size="11">Ensemble Forecast</text>

      <rect x="280" y="0" width="14" height="10" rx="2" fill="rgba(40, 184, 255, 0.3)"/>
      <text x="302" y="9" fill="#b8d0d0" font-family="'Inter', system-ui, sans-serif" font-size="11">95% Confidence Band</text>
    </g>
  </g>
</svg>
