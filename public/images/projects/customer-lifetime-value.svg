<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Customer Lifetime Value Model Analytics Preview">
  <defs>
    <linearGradient id="clv_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081824"/>
      <stop offset="50%" stop-color="#0e2338"/>
      <stop offset="100%" stop-color="#06121e"/>
    </linearGradient>
    <linearGradient id="clv_accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="clv_chart_fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(129, 140, 248, 0.45)"/>
      <stop offset="100%" stop-color="rgba(129, 140, 248, 0.0)"/>
    </linearGradient>
    <linearGradient id="clv_panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.06)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>
    <pattern id="clv_grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(129, 140, 248, 0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#clv_bg)"/>
  <rect width="800" height="450" fill="url(#clv_grid)"/>

  <!-- Top App Header -->
  <rect x="0" y="0" width="800" height="48" fill="rgba(6, 24, 31, 0.85)" stroke="rgba(129, 140, 248, 0.15)" stroke-width="1"/>
  
  <g transform="translate(24, 15)">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="url(#clv_accent)"/>
    <text x="28" y="14" fill="#f0faf8" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="0.5">CUSTOMER LIFETIME VALUE PIPELINE</text>
    <text x="285" y="14" fill="#a78bfa" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600">· BG/NBD &amp; GAMMA-GAMMA ARCHITECTURE</text>
  </g>

  <g transform="translate(670, 16)">
    <circle cx="8" cy="8" r="4" fill="#818cf8"/>
    <text x="20" y="11" fill="#b8d0d0" font-family="'Inter', system-ui, sans-serif" font-size="11">18/18 Tests Passed</text>
  </g>

  <!-- Left: Segmentation & RFM Behavioral Distribution -->
  <rect x="24" y="68" width="280" height="358" rx="14" fill="url(#clv_panel)" stroke="rgba(129, 140, 248, 0.2)" stroke-width="1"/>
  <text x="44" y="98" fill="#818cf8" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">RFM CUSTOMER SEGMENTS</text>

  <!-- Segment 1: High Value -->
  <rect x="40" y="116" width="248" height="68" rx="8" fill="rgba(6, 24, 31, 0.6)" stroke="rgba(94, 234, 212, 0.2)" stroke-width="1"/>
  <text x="54" y="138" fill="#5eead4" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700">HIGH VALUE (TOP 15%)</text>
  <text x="54" y="166" fill="#f0faf8" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="700">$4,850 avg</text>
  <text x="180" y="164" fill="#84a5a5" font-family="'Inter', system-ui, sans-serif" font-size="11">p(Alive)=0.92</text>

  <!-- Segment 2: Medium Value -->
  <rect x="40" y="196" width="248" height="68" rx="8" fill="rgba(6, 24, 31, 0.6)" stroke="rgba(103, 232, 249, 0.2)" stroke-width="1"/>
  <text x="54" y="218" fill="#67e8f9" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700">MEDIUM VALUE (45%)</text>
  <text x="54" y="246" fill="#f0faf8" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="700">$1,620 avg</text>
  <text x="180" y="244" fill="#84a5a5" font-family="'Inter', system-ui, sans-serif" font-size="11">p(Alive)=0.68</text>

  <!-- Segment 3: Low Value -->
  <rect x="40" y="276" width="248" height="68" rx="8" fill="rgba(6, 24, 31, 0.6)" stroke="rgba(167, 139, 250, 0.2)" stroke-width="1"/>
  <text x="54" y="298" fill="#a78bfa" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700">LOW / AT-RISK (40%)</text>
  <text x="54" y="326" fill="#f0faf8" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="700">$340 avg</text>
  <text x="180" y="324" fill="#84a5a5" font-family="'Inter', system-ui, sans-serif" font-size="11">p(Alive)=0.24</text>

  <!-- Right: Actual vs Predicted Revenue Holdout Curve -->
  <rect x="320" y="68" width="456" height="358" rx="14" fill="url(#clv_panel)" stroke="rgba(129, 140, 248, 0.2)" stroke-width="1"/>
  <text x="344" y="98" fill="#a78bfa" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">ACTUAL VS. PREDICTED HOLDOUT VALIDATION</text>
  
  <g transform="translate(344, 116)">
    <!-- Chart Background -->
    <rect x="0" y="0" width="408" height="230" rx="8" fill="rgba(6, 24, 31, 0.7)" stroke="rgba(129, 140, 248, 0.15)" stroke-width="1"/>
    
    <!-- Chart Grid Lines -->
    <line x1="24" y1="40" x2="384" y2="40" stroke="rgba(255, 255, 255, 0.05)"/>
    <line x1="24" y1="90" x2="384" y2="90" stroke="rgba(255, 255, 255, 0.05)"/>
    <line x1="24" y1="140" x2="384" y2="140" stroke="rgba(255, 255, 255, 0.05)"/>
    <line x1="24" y1="190" x2="384" y2="190" stroke="rgba(255, 255, 255, 0.1)"/>
    
    <!-- Actual Holdout Curve (Mint Line) -->
    <path d="M 24 180 Q 80 160 140 120 T 260 80 T 384 50" fill="none" stroke="#5eead4" stroke-width="2.5"/>
    
    <!-- Predicted Curve (Indigo Area + Line) -->
    <path d="M 24 185 Q 80 165 140 128 T 260 86 T 384 56 L 384 190 L 24 190 Z" fill="url(#clv_chart_fill)"/>
    <path d="M 24 185 Q 80 165 140 128 T 260 86 T 384 56" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="4,3"/>

    <!-- Legend -->
    <circle cx="44" cy="20" r="4" fill="#5eead4"/>
    <text x="56" y="24" fill="#b8d0d0" font-family="'Inter', system-ui, sans-serif" font-size="11">Actual Holdout Purchases</text>

    <circle cx="214" cy="20" r="4" fill="#818cf8"/>
    <text x="226" y="24" fill="#b8d0d0" font-family="'Inter', system-ui, sans-serif" font-size="11">BG/NBD Predicted Transactions</text>
  </g>

  <!-- Metric Badges -->
  <g transform="translate(344, 362)">
    <rect x="0" y="0" width="128" height="42" rx="6" fill="rgba(129, 140, 248, 0.1)" stroke="rgba(129, 140, 248, 0.25)" stroke-width="1"/>
    <text x="12" y="16" fill="#84a5a5" font-family="'Inter', system-ui, sans-serif" font-size="9">RMSE HOLD-OUT</text>
    <text x="12" y="34" fill="#f0faf8" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="14">0.342 Trans</text>

    <rect x="140" y="0" width="128" height="42" rx="6" fill="rgba(167, 139, 250, 0.1)" stroke="rgba(167, 139, 250, 0.25)" stroke-width="1"/>
    <text x="152" y="16" fill="#84a5a5" font-family="'Inter', system-ui, sans-serif" font-size="9">GAMMA-GAMMA</text>
    <text x="152" y="34" fill="#a78bfa" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="14">p &lt; 0.001 Sig</text>

    <rect x="280" y="0" width="128" height="42" rx="6" fill="rgba(94, 234, 212, 0.1)" stroke="rgba(94, 234, 212, 0.25)" stroke-width="1"/>
    <text x="292" y="16" fill="#84a5a5" font-family="'Inter', system-ui, sans-serif" font-size="9">MODEL VERIFIED</text>
    <text x="292" y="34" fill="#5eead4" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="14">18 Pytest Tests</text>
  </g>
</svg>
